<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guest requests | Azure Grand PMS</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛎️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --bg: #EEF2F4;
    --surface: #FFFFFF;
    --line: #D5DEE2;
    --text: #15242D;
    --muted: #5A6B74;
    --ink: #0B3954;
    --sea: #1F7A8C;
    --urgent: #B3261E;
    --urgent-soft: #FBE9E7;
    --progress: #9A6B00;
    --progress-soft: #FFF4D6;
    --done: #3F6E45;
    --done-soft: #E6F1E7;
    --fresh: #DDF0F4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #0C1A22;
      --surface: #12242F;
      --line: #23404F;
      --text: #E3ECF0;
      --muted: #93A8B3;
      --ink: #9ED0DD;
      --sea: #5DB4C6;
      --urgent: #FF8A80;
      --urgent-soft: #3A1C1C;
      --progress: #F2C14E;
      --progress-soft: #362B10;
      --done: #8FC596;
      --done-soft: #1A3020;
      --fresh: #173A47;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 400 15px/1.5 "Public Sans", "Segoe UI", system-ui, sans-serif;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  :focus-visible { outline: 3px solid var(--sea); outline-offset: 2px; }
  button { font: inherit; cursor: pointer; }
  .wrap { width: min(1100px, 100% - 2rem); margin-inline: auto; }

  header {
    background: var(--surface); border-bottom: 1px solid var(--line);
    padding-top: env(safe-area-inset-top, 0px);
  }
  header .wrap { display: flex; align-items: center; justify-content: space-between; gap: 1rem; min-height: 64px; flex-wrap: wrap; }
  .title { display: flex; align-items: baseline; gap: .75rem; flex-wrap: wrap; }
  .title h1 { margin: 0; font-size: 1.2rem; font-weight: 700; color: var(--ink); }
  .title span { color: var(--muted); }
  .live { display: inline-flex; align-items: center; gap: .45rem; color: var(--muted); font-size: .9rem; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--done); }
  .live.stale .dot { background: var(--urgent); }

  .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1rem; margin: 1.5rem 0; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 1rem 1.2rem; }
  .stat b { display: block; font-size: 2rem; line-height: 1.1; font-weight: 700; }
  .stat span { color: var(--muted); }
  .stat.urgent b { color: var(--urgent); }

  .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; margin-bottom: .75rem; }
  .tabs { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 3px; }
  .tabs button { border: 0; background: none; color: var(--muted); padding: .4rem .9rem; border-radius: 6px; }
  .tabs button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
  .clear { background: none; border: 1px solid var(--line); color: var(--muted); padding: .45rem .9rem; border-radius: 8px; }
  .clear:hover { border-color: var(--urgent); color: var(--urgent); }

  .list { list-style: none; margin: 0 0 3rem; padding: 0; display: grid; gap: .5rem; }
  .req {
    display: grid; grid-template-columns: 88px 1fr auto; gap: 1rem; align-items: center;
    background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--line);
    border-radius: 8px; padding: .9rem 1rem;
    transition: background-color 1.2s ease;
  }
  .req.urgent { border-left-color: var(--urgent); }
  .req.fresh { background: var(--fresh); }
  .req.is-done { opacity: .7; }
  .room { text-align: center; }
  .room small { display: block; color: var(--muted); font-size: .78rem; }
  .room b { font-size: 1.6rem; font-weight: 700; line-height: 1.1; }
  .what .line1 { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
  .what .type { font-weight: 700; }
  .tag { font-size: .78rem; padding: .1rem .5rem; border-radius: 999px; font-weight: 500; }
  .tag.urgent { background: var(--urgent-soft); color: var(--urgent); }
  .tag.new { background: var(--fresh); color: var(--sea); }
  .tag.in_progress { background: var(--progress-soft); color: var(--progress); }
  .tag.done { background: var(--done-soft); color: var(--done); }
  .what p { margin: .2rem 0 0; }
  .what .meta { color: var(--muted); font-size: .85rem; margin-top: .25rem; }
  .actions { display: flex; gap: .4rem; }
  .actions button { border: 1px solid var(--line); background: var(--surface); color: var(--text); padding: .4rem .75rem; border-radius: 6px; }
  .actions button:hover { border-color: var(--sea); color: var(--sea); }
  @media (max-width: 680px) {
    .req { grid-template-columns: 64px 1fr; }
    .actions { grid-column: 1 / -1; justify-content: flex-end; }
    .stats { grid-template-columns: 1fr 1fr 1fr; gap: .5rem; }
    .stat b { font-size: 1.5rem; }
  }

  .empty { background: var(--surface); border: 1.5px dashed var(--line); border-radius: 10px; padding: 2.5rem 1.5rem; text-align: center; color: var(--muted); }
  .empty strong { display: block; color: var(--text); font-size: 1.05rem; margin-bottom: .3rem; }
  .error { color: var(--urgent); margin: 0 0 1rem; }
  @media (prefers-reduced-motion: reduce) { .req { transition: none; } }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="title"><h1>Guest requests</h1><span>Azure Grand Hotel front office</span></div>
    <div class="live" id="live" aria-live="polite"><span class="dot"></span><span id="live-text">Connecting…</span></div>
  </div>
</header>

<main class="wrap">
  <div class="stats">
    <div class="stat"><b id="s-open">0</b><span>Open</span></div>
    <div class="stat urgent"><b id="s-urgent">0</b><span>Urgent and open</span></div>
    <div class="stat"><b id="s-done">0</b><span>Done today</span></div>
  </div>

  <div class="toolbar">
    <div class="tabs" role="group" aria-label="Filter requests">
      <button type="button" data-f="all" aria-pressed="true">All</button>
      <button type="button" data-f="open" aria-pressed="false">Open</button>
      <button type="button" data-f="urgent" aria-pressed="false">Urgent</button>
      <button type="button" data-f="done" aria-pressed="false">Done</button>
    </div>
    <button type="button" class="clear" id="clear">Clear board</button>
  </div>

  <p class="error" id="error" hidden></p>
  <ul class="list" id="list"></ul>
</main>

<script>
(function () {
  var TYPE_LABEL = { housekeeping: 'Housekeeping', room_service: 'Room service', maintenance: 'Maintenance', other: 'Other' };
  var STATUS_LABEL = { new: 'New', in_progress: 'In progress', done: 'Done' };
  var filter = 'all';
  var items = [];
  var seen = null;
  var freshUntil = {};
  var lastOk = 0;
  var token = '';
  try { token = sessionStorage.getItem('pmsAdminToken') || ''; } catch (e) {}

  var $ = function (id) { return document.getElementById(id); };

  function ago(iso) {
    var s = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 1000));
    if (s < 60) return s + ' s ago';
    if (s < 3600) return Math.round(s / 60) + ' min ago';
    return new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function esc(t) {
    return String(t).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; });
  }

  function headers() {
    var h = { 'Content-Type': 'application/json' };
    if (token) h['X-Admin-Token'] = token;
    return h;
  }

  function askToken() {
    var t = prompt('Enter the PMS admin token');
    if (!t) return false;
    token = t.trim();
    try { sessionStorage.setItem('pmsAdminToken', token); } catch (e) {}
    return true;
  }

  function send(method, url, body) {
    return fetch(url, { method: method, headers: headers(), body: body ? JSON.stringify(body) : undefined })
      .then(function (r) {
        if (r.status === 401 && askToken()) return send(method, url, body);
        if (!r.ok) throw new Error('The server answered ' + r.status + '.');
        return r.json();
      });
  }

  function render() {
    var today = new Date().toDateString();
    var open = items.filter(function (r) { return r.status !== 'done'; });
    $('s-open').textContent = open.length;
    $('s-urgent').textContent = open.filter(function (r) { return r.priority === 'urgent'; }).length;
    $('s-done').textContent = items.filter(function (r) { return r.status === 'done' && new Date(r.updated_at).toDateString() === today; }).length;

    var shown = items.filter(function (r) {
      if (filter === 'open') return r.status !== 'done';
      if (filter === 'urgent') return r.priority === 'urgent' && r.status !== 'done';
      if (filter === 'done') return r.status === 'done';
      return true;
    });

    var list = $('list');
    if (!shown.length) {
      list.innerHTML = '<li class="empty"><strong>' +
        (items.length ? 'Nothing in this view' : 'No requests yet') + '</strong>' +
        (items.length ? 'Pick another filter to see the rest.' : 'Call the concierge from the hotel page. New requests appear here within a few seconds.') +
        '</li>';
      return;
    }

    list.innerHTML = shown.map(function (r) {
      var fresh = (freshUntil[r.id] || 0) > Date.now();
      var next = r.status === 'new' ? '<button type="button" data-id="' + r.id + '" data-s="in_progress">Start</button>' : '';
      var done = r.status !== 'done' ? '<button type="button" data-id="' + r.id + '" data-s="done">Mark done</button>'
                                     : '<button type="button" data-id="' + r.id + '" data-s="new">Reopen</button>';
      return '<li class="req' + (r.priority === 'urgent' ? ' urgent' : '') + (r.status === 'done' ? ' is-done' : '') + (fresh ? ' fresh' : '') + '" data-row="' + r.id + '">' +
        '<div class="room"><small>Room</small><b>' + esc(r.room_number) + '</b></div>' +
        '<div class="what"><div class="line1"><span class="type">' + (TYPE_LABEL[r.request_type] || 'Other') + '</span>' +
          (r.priority === 'urgent' ? '<span class="tag urgent">Urgent</span>' : '') +
          '<span class="tag ' + r.status + '">' + STATUS_LABEL[r.status] + '</span></div>' +
          '<p>' + esc(r.description) + '</p>' +
          '<div class="meta">' + esc(r.id) + ', ' + ago(r.created_at) + ', from ' + esc(r.source || 'AI concierge') + '</div></div>' +
        '<div class="actions">' + next + done + '</div></li>';
    }).join('');
  }

  function poll() {
    fetch('/api/requests', { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (data) {
        items = data.requests || [];
        var now = {};
        items.forEach(function (r) {
          if (seen && !seen[r.id]) freshUntil[r.id] = Date.now() + 6000;
          now[r.id] = true;
        });
        seen = now;
        render();
        lastOk = Date.now();
        $('error').hidden = true;
      })
      .catch(function () {
        $('error').hidden = false;
        $('error').textContent = 'Can’t reach the PMS server. Retrying every few seconds.';
      });
  }

  function tick() {
    var live = $('live');
    if (!lastOk) return;
    var s = Math.round((Date.now() - lastOk) / 1000);
    live.classList.toggle('stale', s > 15);
    $('live-text').textContent = s > 15 ? 'Not updating' : 'Live, refreshes every 3 s';
  }

  document.querySelector('.tabs').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    filter = b.dataset.f;
    document.querySelectorAll('.tabs button').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
    render();
  });

  $('list').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-id]'); if (!b) return;
    b.disabled = true;
    send('PATCH', '/api/requests/' + encodeURIComponent(b.dataset.id), { status: b.dataset.s })
      .then(poll)
      .catch(function (err) { alert('Couldn’t update the request. ' + err.message); b.disabled = false; });
  });

  $('clear').addEventListener('click', function () {
    if (!confirm('Remove every request from the board? Use this to reset before a demo.')) return;
    send('DELETE', '/api/requests').then(poll).catch(function (err) { alert('Couldn’t clear the board. ' + err.message); });
  });

  poll();
  setInterval(poll, 3000);
  setInterval(tick, 1000);
  setInterval(render, 30000);
})();
</script>
</body>
</html>
